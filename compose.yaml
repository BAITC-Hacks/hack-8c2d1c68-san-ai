services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: san
      POSTGRES_USER: san
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U san -d san"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
